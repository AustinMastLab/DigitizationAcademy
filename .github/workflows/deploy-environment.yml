# Build and deploy one environment
#
# Called by deploy.yml for production and development. It builds the assets,
# uploads the deployment package as an artifact, and runs Deployer, which
# downloads that artifact on the server (deploy:ci-artifacts).

name: Deploy environment

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub environment and Deployer host: production or development'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - name: Get Runner IP
        id: ip
        run: echo "ipv4=$(curl -s https://checkip.amazonaws.com)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::147899039648:role/GitHubActionsDeployRole
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Whitelist Runner IP in AWS Security Group
        run: |
          aws ec2 authorize-security-group-ingress \
            --region ${{ secrets.AWS_REGION }} \
            --group-id ${{ secrets.AWS_SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, bcmath, ctype, json, tokenizer, pdo, pdo_mysql
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Create storage directories
        run: |
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p bootstrap/cache

      - name: Install Composer dependencies for deployment runner
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader --no-scripts

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install Yarn dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build assets
        run: npm run production

      - name: Create deployment package
        run: |
          rm -rf deployment-package || true
          TEMP_DIR=$(mktemp -d)
          rsync -av \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=.github \
            --exclude=tests \
            --exclude=storage/logs \
            --exclude=vendor \
            . "$TEMP_DIR/"
          cp -r public/css public/js public/fonts public/images public/svg public/mix-manifest.json "$TEMP_DIR/public/" || true
          mv "$TEMP_DIR" deployment-package

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: digitizationacademy-${{ github.sha }}
          path: deployment-package/
          retention-days: 30

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_PRIVATE_KEY }}

      - name: Trust the deploy servers' SSH host keys
        run: |
          mkdir -p ~/.ssh
          cat .github/known_hosts >> ~/.ssh/known_hosts  # append; ssh-agent may already have added entries
          cat > ~/.ssh/config <<'EOF'
          Host *
            StrictHostKeyChecking yes
          EOF
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/config ~/.ssh/known_hosts

      - name: Deploy with Deployer
        run: vendor/bin/dep deploy ${{ inputs.environment }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Revoke Runner IP from AWS Security Group
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --region ${{ secrets.AWS_REGION }} \
            --group-id ${{ secrets.AWS_SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
