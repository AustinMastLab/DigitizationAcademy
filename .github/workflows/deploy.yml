# CI/CD Deployment Workflow for Digitization Academy
#
# WORKFLOW:
# - Manual run on 'development' branch → Tests → Deploys to DEVELOPMENT
# - Push to 'main' branch → Tests → Calculates version → Deploys to PRODUCTION → Creates GitHub release (only on success)
# - Pull requests run the tests on their own (tests.yml)
#
# VERSION CONTROL:
# Use commit message tags to control version bumps:
# - [major] or [breaking] → Major version bump (1.0.0 → 2.0.0)
# - [minor] or [feature] → Minor version bump (1.0.0 → 1.1.0)
# - Default (no tag) → Patch version bump (1.0.0 → 1.0.1)
#
# SKIP DEPLOYMENT:
# Add [skip deploy] or [no deploy] to your commit message to push without deploying
#

name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# One run at a time per branch, so two quick merges can't deploy at once or
# calculate the same version. A queued run waits; it is never cancelled mid-deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip deploy]') && !contains(github.event.head_commit.message, '[no deploy]')"
    uses: ./.github/workflows/tests.yml

  calculate-version:
    needs: tests
    runs-on: ubuntu-latest
    if: "github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip deploy]') && !contains(github.event.head_commit.message, '[no deploy]')"
    outputs:
      new_version: ${{ steps.new_version.outputs.new_version }}
      current_version: ${{ steps.version_bump.outputs.current_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version bump
        id: version_bump
        env:
          CURRENT_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Select the highest semantic-version tag reachable from HEAD.
          LATEST_TAG="$(git tag --merged HEAD --list --sort=-version:refname | grep -m1 -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          LATEST_TAG="${LATEST_TAG:-0.0.0}"
          echo "Latest tag: $LATEST_TAG"

          echo "Commits since last tag:"
          if [ "$LATEST_TAG" = "0.0.0" ]; then
            git log --oneline
          else
            git log "${LATEST_TAG}..HEAD" --oneline
          fi

          echo "Current commit message:"
          printf '%s\n' "$CURRENT_COMMIT_MSG"

          # Determine version bump based on the current commit message only
          if printf '%s' "$CURRENT_COMMIT_MSG" | grep -Eqi '\[(major|breaking)\]'; then
            BUMP_TYPE="major"
          elif printf '%s' "$CURRENT_COMMIT_MSG" | grep -Eqi '\[(minor|feature)\]'; then
            BUMP_TYPE="minor"
          else
            BUMP_TYPE="patch"
          fi

          echo "Bump type: $BUMP_TYPE"
          echo "bump_type=$BUMP_TYPE" >> "$GITHUB_OUTPUT"
          echo "current_version=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Calculate new version
        id: new_version
        run: |
          CURRENT="${{ steps.version_bump.outputs.current_version }}"
          BUMP_TYPE="${{ steps.version_bump.outputs.bump_type }}"

          if [ "$CURRENT" = "0.0.0" ]; then
            echo "First release detected - setting version to 1.0.0"
            NEW_VERSION="1.0.0"
          else
            if [[ $CURRENT =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
              MAJOR=${BASH_REMATCH[1]}
              MINOR=${BASH_REMATCH[2]}
              PATCH=${BASH_REMATCH[3]}
            else
              MAJOR=0
              MINOR=0
              PATCH=0
            fi

            case $BUMP_TYPE in
              "major")
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              "minor")
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              "patch")
                PATCH=$((PATCH + 1))
                ;;
            esac

            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          fi

          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

  build-and-deploy-production:
    needs: calculate-version
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
    secrets: inherit

  create-release:
    needs: [calculate-version, build-and-deploy-production]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create Release
        run: |
          VERSION="${{ needs.calculate-version.outputs.new_version }}"
          PREVIOUS="${{ needs.calculate-version.outputs.current_version }}"

          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; skipping creation."
            exit 0
          fi

          # Notes list every pull request merged since the previous release.
          START_TAG=()
          if gh release view "$PREVIOUS" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            START_TAG=(--notes-start-tag "$PREVIOUS")
          fi

          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Release $VERSION" \
            --generate-notes \
            "${START_TAG[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-deploy-development:
    needs: tests
    if: "github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/development'"
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: development
    secrets: inherit
